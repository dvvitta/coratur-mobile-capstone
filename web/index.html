<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="curator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>curator</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Mobile width on desktop browsers.

    The app is mounted into #flutter_host (see flutter_bootstrap.js) instead of
    taking over the whole page. The host is capped at a phone width (412px) and
    fills the browser height, so on a desktop browser the UI keeps its mobile
    proportions instead of stretching into a wide desktop layout.

    On a real phone the host simply becomes full width, so the app still runs
    edge-to-edge as usual.

    Need the old full-window behaviour? Open `?layout=full`.
  -->
  <style>
    html {
      height: 100%;
      background-color: #f8f6ff;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      background-color: #f8f6ff;
    }

    #flutter_host {
      width: 412px;
      width: min(412px, 100vw);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #f8f6ff;
    }

    html.flt-fullwidth #flutter_host {
      width: 100vw;
    }
  </style>

  <script>
    (function () {
      if (new URLSearchParams(window.location.search).get('layout') === 'full') {
        document.documentElement.classList.add('flt-fullwidth');
      }
    })();
  </script>
</head>
<body>
  <div id="flutter_host"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
